name: Sync upstream Direct rules

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-direct-rules
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch upstream and merge custom rules
        run: python3 scripts/sync-direct.py

      - name: Commit changed generated rules
        shell: bash
        run: |
          if git diff --quiet -- QuantumultX/Direct.list Shadowrocket/Direct.conf; then
            echo "No rule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QuantumultX/Direct.list Shadowrocket/Direct.conf
          git commit -m "Sync Direct rules from blackmatrix7"
          git push
